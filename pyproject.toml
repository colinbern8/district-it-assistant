# Settings for Python tools. The backend's packages are in backend/requirements*.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors and undefined names, I: import order, UP: modern syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]
